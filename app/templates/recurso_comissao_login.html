{% extends "base.html" %}
{% block title %}Login Comissão de Recursos{% endblock %}

{% block content %}
<div class="login-box">
    <img src="{{ url_for('static', filename='img/logo_senar.png') }}" alt="SENAR" class="login-logo">
    <h1>Comissão de Recursos</h1>
    <p class="muted">Acesso restrito a quem tem a senha da Comissão (diferente da senha da Administração).</p>

    <form method="post" class="form-grid" style="max-width:320px;">
        <input type="hidden" name="proximo" value="{{ proximo }}">
        <input type="password" name="senha" placeholder="Senha da Comissão" required autofocus>
        <button type="submit" class="botao">Entrar</button>
    </form>
</div>
{% endblock %}
