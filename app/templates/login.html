{% extends "base.html" %}
{% block title %}Entrar{% endblock %}

{% block content %}
<div class="login-box">
    <a href="{{ url_for('main.index') }}" class="back-link">&larr; Voltar</a>
    <img src="{{ url_for('static', filename='img/logo_senar.png') }}" alt="SENAR" class="login-logo">
    <h1>Entrar</h1>
    <p class="muted login-texto">Use o e-mail cadastrado e a senha que recebeu por e-mail (ou do RH).</p>

    <form method="post" class="login-form">
        <label class="campo-icone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <input type="email" name="email" placeholder="Seu e-mail" required autofocus autocomplete="username" aria-label="E-mail">
        </label>
        <label class="campo-icone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" name="senha" placeholder="Senha" required autocomplete="current-password" aria-label="Senha">
        </label>
        <button type="submit" class="botao login-botao">Entrar</button>
    </form>

    <p class="login-links">
        <a href="{{ url_for('main.esqueci_senha') }}">Esqueci minha senha</a>
        <span class="login-divisor" aria-hidden="true"></span>
        <span>Primeiro acesso? Fale com o RH</span>
    </p>
</div>
{% endblock %}
